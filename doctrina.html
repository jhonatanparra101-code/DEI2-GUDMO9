async function dbGet(key){
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/doctrina?key=eq.${encodeURIComponent(key)}&select=data`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });

    const arr = await r.json();
    if(arr.length && arr[0].data){
      try { return JSON.parse(arr[0].data); } catch(e){ return null; }
    }
    return null;
  } catch(e){ console.warn('dbGet:', e); return null; }
}

async function dbSet(key, value){
  try {
    const body = { key, data: JSON.stringify(value), updated_at: new Date().toISOString() };
    const r = await fetch(`${SUPABASE_URL}/rest/v1/doctrina`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify(body)
    });
    return r.ok;
  } catch(e){ console.warn('dbSet:', e); return false; }

<script>
// ═══════════════════════════════════════════════════════════
// LÓGICA DEL MÓDULO
// ═══════════════════════════════════════════════════════════
var docExamenActual = null;

function showDocSub(sub, btn){
  ['lista','examen','buscar'].forEach(function(s){
    var el = document.getElementById('docSub-'+s);
    if(el) el.style.display = (s===sub)?'block':'none';
  });
  document.querySelectorAll('.doc-subtab').forEach(function(b){
    b.classList.remove('active');
    b.style.background = 'var(--card)';
    b.style.color = 'var(--text)';
    b.style.border = '1px solid var(--border)';
  });
  if(btn){
    btn.classList.add('active');
    btn.style.background = 'var(--gold)';
    btn.style.color = '#000';
    btn.style.border = 'none';
  }
  if(sub==='lista') renderDocLista();
  if(sub==='examen') renderDocExamenInicio();
}

var DOC_NIVELES = {
  1: {nombre:'⚖️ LEYES', desc:'Marco legal superior — Congreso de la República'},
  2: {nombre:'📋 DECRETOS', desc:'Reglamentan las leyes — Presidencia / Mindefensa'},
  3: {nombre:'📄 RESOLUCIONES', desc:'Desarrollan los decretos — Dirección General Policía'},
  4: {nombre:'📝 INSTRUCTIVOS', desc:'Lineamientos operativos internos — JESEP / UNDMO'},
  5: {nombre:'🎥 LIBRETOS Y GUÍAS', desc:'Herramientas prácticas de campo'},
  6: {nombre:'🌟 DOCTRINA COMPLEMENTARIA', desc:'No es propia de la UNDMO, pero el comando la solicita'}
};

function renderDocLista(){
  var cont = document.getElementById('docListaContainer');
  if(!cont) return;
  var html = '';
  html += '<div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px">';
  html += '<div style="font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">🔺 Jerarquía normativa</div>';
  html += '<div style="font-size:11px;color:var(--muted);line-height:1.7">';
  html += 'Los documentos se ordenan de mayor a menor rango. Una norma inferior <b>desarrolla</b> y no puede contradecir a una superior:<br>';
  html += '<b style="color:#0ea5e9">LEY</b> → <b style="color:#8b5cf6">DECRETO</b> → <b style="color:#3b82f6">RESOLUCIÓN</b> → <b style="color:#a855f7">INSTRUCTIVO</b> → <b style="color:#10b981">LIBRETO</b>';
  html += '</div></div>';
  [1,2,3,4,5,6].forEach(function(nivel){
    var docsNivel = DOCTRINA.filter(function(d){ return d.nivel===nivel; });
    if(!docsNivel.length) return;
    var info = DOC_NIVELES[nivel];
    html += '<div style="margin-bottom:6px;margin-top:14px">';
    html += '<div style="font-size:12px;font-weight:800;color:var(--text)">'+info.nombre+'</div>';
    html += '<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+info.desc+'</div>';
    html += '</div>';
    docsNivel.forEach(function(d){
      html += '<div onclick="abrirDocModal(\''+d.id+'\')" style="background:var(--card);border:1px solid var(--border);border-left:4px solid '+d.color+';border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer">';
      html += '<div style="display:flex;align-items:flex-start;gap:10px">';
      html += '<div style="font-size:22px">'+d.icono+'</div>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-size:12px;font-weight:800;color:'+d.color+'">'+d.tipo+' '+d.numero+'</div>';
      html += '<div style="font-size:11px;color:var(--text);font-weight:600;margin:3px 0;line-height:1.3">'+d.titulo+'</div>';
      html += '<div style="font-size:10px;color:var(--muted)">📅 '+d.fecha+' · '+d.puntosClave.length+' puntos · '+d.preguntas.length+' preguntas</div>';
      html += '</div>';
      html += '<div style="color:var(--muted);font-size:16px">›</div>';
      html += '</div></div>';
    });
  });
  cont.innerHTML = html;
}

function abrirDocModal(docId){
  var d = DOCTRINA.find(function(x){ return x.id===docId; });
  if(!d) return;
  document.getElementById('docModalTitulo').innerHTML = d.icono+' '+d.tipo+' '+d.numero;
  var html = '';
  html += '<div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px">';
  html += '<div style="display:inline-block;background:'+d.color+';color:#fff;border-radius:5px;padding:1px 7px;font-size:9px;font-weight:700;margin-bottom:6px">'+d.rango.toUpperCase()+'</div>';
  html += '<div style="font-size:13px;font-weight:700;color:'+d.color+';margin-bottom:8px;line-height:1.3">'+d.titulo+'</div>';
  html += '<table style="width:100%;font-size:11px;color:var(--text)">';
  html += '<tr><td style="color:var(--muted);padding:2px 8px 2px 0;white-space:nowrap;vertical-align:top">Fecha</td><td>'+d.fecha+'</td></tr>';
  html += '<tr><td style="color:var(--muted);padding:2px 8px 2px 0;vertical-align:top">Emisor</td><td>'+d.emisor+'</td></tr>';
  html += '<tr><td style="color:var(--muted);padding:2px 8px 2px 0;vertical-align:top">Deroga</td><td>'+d.deroga+'</td></tr>';
  html += '<tr><td style="color:var(--muted);padding:2px 8px 2px 0;vertical-align:top">Vigencia</td><td style="color:#22c55e;font-weight:600">'+d.vigencia+'</td></tr>';
  html += '</table></div>';
  html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">📌 En qué consiste</div>';
  html += '<div style="font-size:12px;color:var(--text);line-height:1.5;background:var(--card);border-radius:8px;padding:10px">'+d.resumen+'</div></div>';
  html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">🎯 Puntos clave</div>';
  d.puntosClave.forEach(function(p, i){
    html += '<div style="display:flex;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text);line-height:1.4">';
    html += '<div style="background:'+d.color+';color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'+(i+1)+'</div>';
    html += '<div>'+p+'</div></div>';
  });
  html += '</div>';
  if(d.terminos && d.terminos.length){
    html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">📖 Términos clave</div>';
    d.terminos.forEach(function(t){
      html += '<div style="background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:5px">';
      html += '<div style="font-size:12px;font-weight:700;color:'+d.color+'">'+t.t+'</div>';
      html += '<div style="font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px">'+t.d+'</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  if(d.preguntas && d.preguntas.length){
    html += '<button onclick="iniciarExamen([\''+d.id+'\'])" style="width:100%;background:'+d.color+';color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:700;cursor:pointer">📝 Practicar 10 preguntas de este documento</button>';
  }
  document.getElementById('docModalBody').innerHTML = html;
  document.getElementById('docModal').style.display = 'flex';
}
function cerrarDocModal(){ document.getElementById('docModal').style.display = 'none'; }

function renderDocExamenInicio(){
  var cont = document.getElementById('docExamenContainer');
  if(!cont) return;
  var totalP = DOCTRINA.reduce(function(s,d){ return s+(d.preguntas?d.preguntas.length:0); }, 0);
  var html = '';
  html += '<div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;text-align:center">';
  html += '<div style="font-size:32px;margin-bottom:6px">📝</div>';
  html += '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">Modo Examen</div>';
  html += '<div style="font-size:11px;color:var(--muted);line-height:1.5">Pon a prueba tu conocimiento. Elige qué practicar.</div>';
  html += '</div>';
  html += '<button onclick="iniciarExamen(\'all\')" style="width:100%;background:var(--gold);color:#000;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:8px">🎓 Examen completo ('+totalP+' preguntas)</button>';
  html += '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">O practica por documento (10 de 13):</div>';
  DOCTRINA.forEach(function(d){
    if(!d.preguntas || !d.preguntas.length) return;
    html += '<button onclick="iniciarExamen([\''+d.id+'\'])" style="width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-left:4px solid '+d.color+';border-radius:8px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px;text-align:left">'+d.icono+' '+d.tipo+' '+d.numero+' <span style="color:var(--muted);font-size:10px">('+d.preguntas.length+' preguntas)</span></button>';
  });
  cont.innerHTML = html;
}

function iniciarExamen(scope){
  var pool = [];
  DOCTRINA.forEach(function(d){
    if(!d.preguntas) return;
    if(scope==='all' || (Array.isArray(scope) && scope.indexOf(d.id)>=0)){
      d.preguntas.forEach(function(p){
        // Mezclar opciones
        var indices = p.op.map(function(_,i){ return i; });
        for(var k=indices.length-1;k>0;k--){
          var j2=Math.floor(Math.random()*(k+1));
          var t2=indices[k]; indices[k]=indices[j2]; indices[j2]=t2;
        }
        var newOp = indices.map(function(idx){ return p.op[idx]; });
        var newCorrecta = indices.indexOf(p.correcta);
        pool.push({q:p.q, op:newOp, correcta:newCorrecta, doc:d.tipo+' '+d.numero, color:d.color});
      });
    }
  });
  for(var i=pool.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp;
  }
  if(!pool.length){ alert('Este documento aún no tiene preguntas.'); return; }
  // Examen por documento: tomar solo 10 de 13
  if(scope !== 'all' && pool.length > 10){
    pool = pool.slice(0, 10);
  }
  var scopeLabel = scope==='all' ? 'Examen completo' : (Array.isArray(scope) ? scope.join(', ') : scope);
  var cont = document.getElementById('docExamenContainer');
  cont.innerHTML = '<div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">'
    +'<div style="font-size:28px;margin-bottom:8px">📝</div>'
    +'<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">'+scopeLabel+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-bottom:14px">'+pool.length+' preguntas. Escribe tu nombre para empezar.</div>'
    +'<input type="text" id="examNombreInput" placeholder="APELLIDO NOMBRE (ej: PÉREZ JUAN)" '
    +'style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;text-transform:uppercase;text-align:center;margin-bottom:12px;box-sizing:border-box">'
    +'<button id="btnIniciarExam" style="width:100%;background:var(--gold);color:#000;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:800;cursor:pointer">▶ Iniciar examen</button>'
    +'</div>';
  document.getElementById('btnIniciarExam').onclick = function(){
    var nombre = (document.getElementById('examNombreInput').value||'').trim().toUpperCase();
    if(!nombre || nombre.length<3){ alert('Escribe tu nombre para continuar'); document.getElementById('examNombreInput').focus(); return; }
    docExamenActual = { preguntas:pool, idx:0, respuestas:[], correctas:0, nombre:nombre, scope:scopeLabel, inicio:Date.now() };
    renderExamenPregunta();
  };
  setTimeout(function(){ var inp=document.getElementById('examNombreInput'); if(inp) inp.focus(); },100);
}

function renderExamenPregunta(){
  var cont = document.getElementById('docExamenContainer');
  var ex = docExamenActual;
  if(!ex) return;
  if(ex.idx >= ex.preguntas.length){ renderExamenResultado(); return; }
  var p = ex.preguntas[ex.idx];
  var html = '';
  var pct = Math.round((ex.idx/ex.preguntas.length)*100);
  html += '<div style="margin-bottom:12px">';
  html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px">';
  html += '<span>Pregunta '+(ex.idx+1)+' de '+ex.preguntas.length+'</span><span>'+ex.correctas+' correctas</span></div>';
  html += '<div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--gold);height:100%;width:'+pct+'%"></div></div>';
  html += '</div>';
  html += '<div style="background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">';
  html += '<div style="font-size:9px;color:'+p.color+';font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">'+p.doc+'</div>';
  html += '<div style="font-size:14px;font-weight:600;color:var(--text);line-height:1.4">'+p.q+'</div>';
  html += '</div>';
  p.op.forEach(function(opcion, i){
    html += '<button onclick="responderExamen('+i+')" id="opcExam'+i+'" style="width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:12px;font-size:13px;cursor:pointer;margin-bottom:8px;text-align:left;line-height:1.3">'+opcion+'</button>';
  });
  cont.innerHTML = html;
}

function responderExamen(elegida){
  var ex = docExamenActual;
  if(!ex) return;
  var p = ex.preguntas[ex.idx];
  var esCorrecta = (elegida===p.correcta);
  if(esCorrecta) ex.correctas++;
  ex.respuestas.push({elegida:elegida, correcta:p.correcta});
  p.op.forEach(function(o, i){
    var btn = document.getElementById('opcExam'+i);
    if(!btn) return;
    btn.onclick = null;
    if(i===p.correcta){
      btn.style.background = 'rgba(34,197,94,.2)';
      btn.style.border = '1px solid #22c55e';
      btn.style.color = '#22c55e';
      btn.innerHTML = '✓ '+btn.innerHTML;
    } else if(i===elegida){
      btn.style.background = 'rgba(239,68,68,.2)';
      btn.style.border = '1px solid #ef4444';
      btn.style.color = '#ef4444';
      btn.innerHTML = '✗ '+btn.innerHTML;
    } else { btn.style.opacity = '.5'; }
  });
  var cont = document.getElementById('docExamenContainer');
  var nextBtn = document.createElement('button');
  nextBtn.style.cssText = 'width:100%;background:var(--gold);color:#000;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px';
  nextBtn.textContent = (ex.idx+1 >= ex.preguntas.length) ? '🏁 Ver resultado' : '→ Siguiente pregunta';
  nextBtn.onclick = function(){ ex.idx++; renderExamenPregunta(); };
  cont.appendChild(nextBtn);
}

async function renderExamenResultado(){
  var cont = document.getElementById('docExamenContainer');
  var ex = docExamenActual;
  var total = ex.preguntas.length;
  var pct = Math.round((ex.correctas/total)*100);
  var color = pct>=80 ? '#22c55e' : (pct>=60 ? '#f59e0b' : '#ef4444');
  var msg = pct>=80 ? '¡Excelente! Dominas el tema.' : (pct>=60 ? 'Bien, pero repasa los puntos fallados.' : 'Necesitas repasar más. ¡Ánimo!');
  var duracion = ex.inicio ? Math.round((Date.now()-ex.inicio)/60000) : 0;
  var html = '';
  html += '<div style="background:var(--navy);border:1px solid '+color+';border-radius:12px;padding:20px;text-align:center;margin-bottom:12px">';
  if(ex.nombre) html += '<div style="font-size:13px;color:var(--muted);margin-bottom:4px">'+ex.nombre+'</div>';
  html += '<div style="font-size:42px;font-weight:900;color:'+color+'">'+pct+'%</div>';
  html += '<div style="font-size:14px;color:var(--text);font-weight:700;margin:4px 0">'+ex.correctas+' de '+total+' correctas</div>';
  html += '<div style="font-size:12px;color:var(--muted)">'+msg;
  if(duracion>0) html += ' ('+duracion+' min)';
  html += '</div></div>';

  var falladas = [], acertadas = [];
  ex.preguntas.forEach(function(p, i){
    var r = ex.respuestas[i];
    if(!r) return;
    if(r.elegida !== r.correcta){
      falladas.push({q:p.q, doc:p.doc, color:p.color, elegida:p.op[r.elegida], correcta:p.op[r.correcta]});
    } else {
      acertadas.push({q:p.q, doc:p.doc, color:p.color, correcta:p.op[r.correcta]});
    }
  });

  if(falladas.length){
    html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">❌ Preguntas falladas ('+falladas.length+')</div>';
    falladas.forEach(function(f){
      html += '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-left:3px solid '+f.color+';border-radius:8px;padding:10px;margin-bottom:6px">';
      html += '<div style="font-size:9px;color:'+f.color+';font-weight:700">'+f.doc+'</div>';
      html += '<div style="font-size:12px;color:var(--text);font-weight:600;margin:4px 0;line-height:1.3">'+f.q+'</div>';
      html += '<div style="font-size:11px"><span style="color:#ef4444">✗ Respondió:</span> '+f.elegida+'</div>';
      html += '<div style="font-size:11px"><span style="color:#22c55e">✓ Correcta:</span> '+f.correcta+'</div></div>';
    });
    html += '</div>';
  }
  if(acertadas.length){
    html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#22c55e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">✅ Preguntas acertadas ('+acertadas.length+')</div>';
    acertadas.forEach(function(a){
      html += '<div style="background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-left:3px solid '+a.color+';border-radius:8px;padding:8px 10px;margin-bottom:4px">';
      html += '<div style="font-size:9px;color:'+a.color+';font-weight:700">'+a.doc+'</div>';
      html += '<div style="font-size:11px;color:var(--text);line-height:1.3;margin-top:2px">'+a.q+'</div>';
      html += '<div style="font-size:10px;color:#22c55e;margin-top:2px">✓ '+a.correcta+'</div></div>';
    });
    html += '</div>';
  }

  // Guardar resultado en Supabase (tabla doctrina aislada)
  var resultado = {
    nombre: ex.nombre||'Anónimo',
    scope: ex.scope||'General',
    fecha: new Date().toISOString(),
    total: total,
    correctas: ex.correctas,
    pct: pct,
    duracion: duracion,
    falladas: falladas.map(function(f){ return {q:f.q, doc:f.doc, elegida:f.elegida, correcta:f.correcta}; })
  };
  var resultadosExistentes = await dbGet('exam_results') || [];
  resultadosExistentes.unshift(resultado);
  if(resultadosExistentes.length > 500) resultadosExistentes = resultadosExistentes.slice(0, 500);
  await dbSet('exam_results', resultadosExistentes);

  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  html += '<button onclick="renderDocExamenInicio()" style="flex:1;min-width:120px;background:var(--gold);color:#000;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer">🔄 Otro examen</button>';
  html += '<button onclick="verResultadosExamen()" style="flex:1;min-width:120px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer">📊 Ver resultados</button>';
  html += '</div>';
  cont.innerHTML = html;
  docExamenActual = null;
}

async function verResultadosExamen(){
  var resultados = await dbGet('exam_results') || [];
  if(!resultados.length){ alert('Aún no hay resultados de exámenes guardados.'); return; }
  var html = '<div style="max-height:75vh;overflow-y:auto">';
  html += '<h3 style="margin:0 0 4px;font-size:15px;color:var(--text)">📊 Resultados de exámenes</h3>';
  html += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">'+resultados.length+' exámenes realizados</div>';
  var porPersona = {};
  resultados.forEach(function(r){
    if(!porPersona[r.nombre]) porPersona[r.nombre] = {total:0, correctas:0, exams:0, mejorPct:0, fallidas:{}};
    var p = porPersona[r.nombre];
    p.total += r.total; p.correctas += r.correctas; p.exams++;
    if(r.pct > p.mejorPct) p.mejorPct = r.pct;
    (r.falladas||[]).forEach(function(f){
      var key = f.doc+'|'+f.q;
      if(!p.fallidas[key]) p.fallidas[key] = {q:f.q, doc:f.doc, correcta:f.correcta, veces:0};
      p.fallidas[key].veces++;
    });
  });
  html += '<div style="font-size:11px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">👥 Resumen por funcionario</div>';
  var personas = Object.keys(porPersona).sort();
  personas.forEach(function(nombre){
    var p = porPersona[nombre];
    var pctProm = p.total>0 ? Math.round((p.correctas/p.total)*100) : 0;
    var color2 = pctProm>=80 ? '#22c55e' : (pctProm>=60 ? '#f59e0b' : '#ef4444');
    var topFalladas = Object.values(p.fallidas).sort(function(a,b){ return b.veces-a.veces; }).slice(0,3);
    html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    html += '<div style="font-size:13px;font-weight:700;color:var(--text)">'+nombre+'</div>';
    html += '<div style="font-size:22px;font-weight:900;color:'+color2+'">'+pctProm+'%</div></div>';
    html += '<div style="font-size:10px;color:var(--muted)">'+p.exams+' exámenes · '+p.correctas+'/'+p.total+' correctas · Mejor: '+p.mejorPct+'%</div>';
    if(topFalladas.length){
      html += '<div style="margin-top:6px;font-size:10px;color:#ef4444;font-weight:600">Preguntas más falladas:</div>';
      topFalladas.forEach(function(f){
        html += '<div style="font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3">• <span style="color:var(--text)">'+f.q+'</span> <span style="color:#ef4444">('+f.veces+'x)</span><br>Correcta: <span style="color:#22c55e">'+f.correcta+'</span></div>';
      });
    }
    html += '</div>';
  });
  html += '<div style="font-size:11px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px">📋 Historial detallado</div>';
  resultados.slice(0,100).forEach(function(r){
    var fecha = new Date(r.fecha).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    var color3 = r.pct>=80 ? '#22c55e' : (r.pct>=60 ? '#f59e0b' : '#ef4444');
    html += '<div style="background:var(--navy);border-radius:8px;padding:8px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">';
    html += '<div><div style="font-size:12px;font-weight:600;color:var(--text)">'+r.nombre+'</div>';
    html += '<div style="font-size:9px;color:var(--muted)">'+fecha+' · '+r.scope+(r.duracion?' · '+r.duracion+' min':'')+'</div></div>';
    html += '<div style="font-size:16px;font-weight:900;color:'+color3+'">'+r.pct+'%</div></div>';
  });
  html += '<button onclick="if(confirm(\'¿Borrar TODOS los resultados? Esta acción no se puede deshacer.\'))clearExamResults()" style="width:100%;background:rgba(239,68,68,.12);border:1px solid #ef4444;border-radius:9px;padding:10px;font-size:11px;font-weight:700;color:#ef4444;cursor:pointer;margin-top:12px">🗑️ Borrar todos los resultados</button>';
  html += '</div>';
  document.getElementById('docModalTitulo').textContent = '📊 Resultados';
  document.getElementById('docModalBody').innerHTML = html;
  document.getElementById('docModal').style.display = 'flex';
}

async function clearExamResults(){
  await dbSet('exam_results', []);
  alert('Resultados borrados.');
  cerrarDocModal();
}

function docBuscar(){
  var q = (document.getElementById('docBuscarInput').value||'').toLowerCase().trim();
  var cont = document.getElementById('docBuscarResultados');
  if(!cont) return;
  if(q.length < 2){ cont.innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px">Escribe al menos 2 letras...</div>'; return; }
  var hits = [];
  DOCTRINA.forEach(function(d){
    if(d.titulo.toLowerCase().indexOf(q)>=0 || d.resumen.toLowerCase().indexOf(q)>=0 || d.numero.toLowerCase().indexOf(q)>=0){
      hits.push({doc:d, tipo:'General', texto:d.titulo});
    }
    (d.puntosClave||[]).forEach(function(p){
      if(p.toLowerCase().indexOf(q)>=0) hits.push({doc:d, tipo:'Punto clave', texto:p});
    });
    (d.terminos||[]).forEach(function(t){
      if(t.t.toLowerCase().indexOf(q)>=0 || t.d.toLowerCase().indexOf(q)>=0) hits.push({doc:d, tipo:'Término: '+t.t, texto:t.d});
    });
  });
  if(!hits.length){ cont.innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px">Sin resultados para "'+q+'"</div>'; return; }
  var html = '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">'+hits.length+' resultado(s)</div>';
  hits.forEach(function(h){
    html += '<div onclick="abrirDocModal(\''+h.doc.id+'\')" style="background:var(--card);border:1px solid var(--border);border-left:4px solid '+h.doc.color+';border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer">';
    html += '<div style="font-size:10px;font-weight:700;color:'+h.doc.color+'">'+h.doc.tipo+' '+h.doc.numero+' · '+h.tipo+'</div>';
    html += '<div style="font-size:11px;color:var(--text);line-height:1.4;margin-top:3px">'+h.texto+'</div></div>';
  });
  cont.innerHTML = html;
}

renderDocLista();
